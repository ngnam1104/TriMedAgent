[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "trimedagent"
version = "2.0.0"
description = "Medical Image Analysis Pipeline with Visual Triage"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
]
dependencies = [
    # Core
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "transformers>=4.36.0",
    "accelerate>=0.25.0",
    "bitsandbytes>=0.41.0",
    
    # Vision
    "pillow>=10.0.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "opencv-python>=4.8.0",
    
    # Tools
    "segment-anything",
    
    # UI
    "gradio>=4.0.0",
    "nest-asyncio",
    
    # Utils
    "requests",
    "tqdm",
]

[project.optional-dependencies]
rag = ["groq", "sentence-transformers"]
full = ["groundingdino-py", "supervision"]

[project.urls]
"Homepage" = "https://github.com/your-repo/TriMedAgent"

[tool.setuptools.packages.find]
include = ["models*"]

[tool.wheel]
exclude = ["images*", "*.ipynb"]
